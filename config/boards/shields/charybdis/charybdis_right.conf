CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y

# ========================================
# PMW3610 센서 기본 설정
# ========================================
CONFIG_PMW3610=y

# ⭐ CPI 설정 (기본: 400~1600)
# 듀얼 모니터: 1200~1600 권장
# 높을수록 민감, 낮을수록 둔감
CONFIG_PMW3610_CPI=1400

# CPI Divisor (기본: 1~8)
# 실제 CPI = CPI / CPI_DIVIDOR
# 예: 1400 / 4 = 350 실제 CPI
CONFIG_PMW3610_CPI_DIVIDOR=3
# 센서 방향 (90도 회전)
CONFIG_PMW3610_ORIENTATION_90=y


# ========================================
# Snipe 모드 (정밀 모드 - 선택적)
# ========================================
# Snipe CPI (정밀 모드 시 낮은 감도)
CONFIG_PMW3610_SNIPE_CPI=200
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=1


# ========================================
# 스크롤 설정
# ========================================
# 스크롤 틱 (기본: 50~100)
# 높을수록 스크롤이 더 세밀함
CONFIG_PMW3610_SCROLL_TICK=70


# ========================================
# 축 반전 (필요시)
# ========================================
# X축 반전
CONFIG_PMW3610_INVERT_X=y


# ========================================
# 성능 최적화
# ========================================
# 폴링 레이트 (기본: 125Hz)
# 듀얼 모니터: 125Hz 권장 (배터리와 성능 균형)
CONFIG_PMW3610_POLLING_RATE_125_SW=y

# 스마트 알고리즘 (배터리 절약)
CONFIG_PMW3610_SMART_ALGORITHM=y

# Auto mouse
#CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=250

# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y



# ========================================
# 설정 설명
# ========================================

# CPI (Counts Per Inch) 계산:
# ─────────────────────────────────
# 실제 CPI = CONFIG_PMW3610_CPI / CONFIG_PMW3610_CPI_DIVIDOR
# 현재 설정: 1400 / 4 = 350 CPI
#
# CPI가 의미하는 것:
# - 350 CPI: 트랙볼을 1인치(2.54cm) 굴렸을 때 350픽셀 이동
# - 듀얼 모니터(5120px): 약 14.6인치 굴려야 전체 이동
#
# 권장 값:
# - 일반 사용: 300~400 CPI
# - 빠른 이동: 400~600 CPI
# - 게이밍: 600~800 CPI

# CPI vs 소프트웨어 스케일링:
# ─────────────────────────────────
# 1. CPI 증가 (하드웨어):
#    - 장점: 정밀도 높음, 떨림 적음
#    - 단점: 배터리 소모 증가
#
# 2. 소프트웨어 스케일링 (keymap):
#    - 장점: 유연한 속도 조절, 배터리 절약
#    - 단점: 극단적 스케일링 시 정밀도 저하
#
# 추천: CPI는 중간값(350~400) + 소프트웨어 스케일링 조합

# 폴링 레이트:
# ─────────────────────────────────
# 125Hz = 8ms마다 센서 읽음
# - 장점: 배터리 절약, 대부분 충분
# - 단점: 매우 빠른 움직임에서 약간 끊김
#
# 250Hz (선택 가능):
# - 장점: 더 부드러움
# - 단점: 배터리 2배 소모
# CONFIG_PMW3610_POLLING_RATE_250_SW=y

# 듀얼 모니터별 추천 설정:
# ─────────────────────────────────
#
# FHD x 2 (3840x1080):
# CONFIG_PMW3610_CPI=1200
# CONFIG_PMW3610_CPI_DIVIDOR=4
# → 실제 CPI: 300
#
# QHD x 2 (5120x1440):
# CONFIG_PMW3610_CPI=1400
# CONFIG_PMW3610_CPI_DIVIDOR=4
# → 실제 CPI: 350 (현재 설정)
#
# 4K x 2 (7680x2160):
# CONFIG_PMW3610_CPI=1600
# CONFIG_PMW3610_CPI_DIVIDOR=4
# → 실제 CPI: 400

# 미세 조정:
# ─────────────────────────────────
#
# 너무 빠른 경우:
# 1. CPI_DIVIDOR 증가: 4 → 5 → 6
# 2. CPI 감소: 1400 → 1200 → 1000
#
# 너무 느린 경우:
# 1. CPI_DIVIDOR 감소: 4 → 3 → 2
# 2. CPI 증가: 1400 → 1600 → 1800
#
# 떨림이 심한 경우:
# 1. CPI 증가 (하드웨어 정밀도 향상)
# 2. 소프트웨어 스케일 감소
#
# 배터리가 빨리 닳는 경우:
# 1. SMART_ALGORITHM 활성화 (이미 설정됨)
# 2. CPI 감소
# 3. 폴링 레이트 유지 (125Hz)